<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>__CW_APP_NAME__ · Offline</title>
    <script>
      // Same theme rule as every page: the domain-wide cw_theme cookie, else the system.
      (function () {
        try {
          var match = document.cookie.match(/(?:^|; )cw_theme=([^;]*)/);
          var theme = match ? decodeURIComponent(match[1]) : "auto";
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <style>
      /* The hub's sign-in card, with its tokens inlined: this page is served
         from the service worker with no connection, so it can't load the
         design stylesheet or the webfonts. */
      :root {
        --canvas: #f6f4f0;
        --surface: #ffffff;
        --border-soft: #e4e0d9;
        --ink: #1f1d1a;
        --muted: #5a5651;
        --brand: #b4401e;
        --brand-ink: #ffffff;
        --brand-hover: #a0381a;
        --shadow-1: 0 1px 2px rgb(31 29 26 / 0.06);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --canvas: #1a1816;
        --surface: #262320;
        --border-soft: #34302b;
        --ink: #f1ede7;
        --muted: #a69f96;
        --brand-hover: #c44a25;
        --shadow-1: 0 1px 2px rgb(0 0 0 / 0.35);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 36px 32px;
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: 16px;
        box-shadow: var(--shadow-1);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
      .brand svg { display: block; }
      .brand span { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; }
      h1 { margin: 0 0 8px; font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 600; line-height: 1.2; }
      .lede { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: var(--muted); }
      button {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: var(--brand-ink);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 2px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 1px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main class="card">
        <div class="brand">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 15V11C9.5 9.6193 10.6193 8.5 12 8.5H15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>__CW_APP_NAME__</span>
        </div>
        <h1>You're offline</h1>
        <p class="lede">__CW_APP_NAME__ needs an internet connection. Check your Wi-Fi or mobile data — it reconnects as soon as you're back.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </main>
    </div>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
